aid: first-resonance
name: First Resonance
description: 'First Resonance builds ION, a modern Factory Operating System (MES) for
  companies manufacturing complex hardware in aerospace, defense, robotics, medical
  devices, and clean energy. ION provides digital work instructions (Procedures and
  Runs), part and inventory traceability, mBOM/aBOM management, quality and compliance
  workflows, production scheduling (ION AutoPlan), and analytics. For developers, ION
  exposes a GraphQL API (api.buildwithion.com) secured with OAuth 2.0 client-credentials
  API keys, cursor-based (Relay) pagination, webhook subscriptions for realtime events,
  and a beta hosted MCP server so AI agents can operate the factory system. This profile
  was enriched from First Resonance''s public developer manual.'
